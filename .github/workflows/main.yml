name: Security Scan
on: [push, pull_request]
jobs:
  security-scan:
    runs-on: [self-hosted, laptop-armis]
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Armis CLI
        run: |
          /opt/homebrew/bin/dlv
      - name: Scan Repository
        env:
          ARMIS_CLIENT_ID: ${{ secrets.ARMIS_CLIENT_ID }}
          ARMIS_CLIENT_SECRET: ${{ secrets.ARMIS_CLIENT_SECRET }}
        run: |
          /Users/sheadrick/repos/armis-cli/bin/armis-cli-debug \
          scan repo . \
          --format sarif > results.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
