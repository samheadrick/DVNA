name: Security Scan
on: [pull_request]
jobs:
  security-scan:
    runs-on: [self-hosted, laptop]
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan Repository
        env:
          ARMIS_CLIENT_ID: ${{ secrets.ARMIS_CLIENT_ID }}
          ARMIS_CLIENT_SECRET: ${{ secrets.ARMIS_CLIENT_SECRET }}
        run: |
          /opt/homebrew/bin/dlv exec /Users/sheadrick/repos/armis-cli/bin/armis-cli-debug \
          --headless \
          --log-dest=/tmp/dlv.log \
          --listen=127.0.0.1:40000 \
          --api-version=2 \
          -- scan repo /Users/sheadrick/repos/DVNA-master \
          --format sarif \
          --fail-on '' > /Users/sheadrick/repos/DVNA-master/results.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: /Users/sheadrick/repos/DVNA-master/results.sarif
